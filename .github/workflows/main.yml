on:
  push:
    # paths:
    #   - instana/**.yaml

jobs:
  get-selected-distribution:
    name: Get selected distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get distribution
        id: selected-distro
        run: echo "distro=$(cat selected-distribution)" >> $GITHUB_OUTPUT
      - name: Test output
        run: echo ${{ steps.selected-distro.outputs.distro}}
  config_validation_job:
    needs: [get-selected-distribution]
    name: Collector Validation
    runs-on: ubuntu-latest
    steps:
      - name: Build Docker container
        run: docker build -t collector-container-${{get-selected-distribution.selected-distro.outputs.distro}} -f validation/Dockerfile --build-arg VERSION=${{get-selected-distribution.selected-distro.outputs.distro}}
      - name: Run container
        run: docker run collector-container-${{get-selected-distribution.selected-distro.outputs.distro}}


