jobs:
  get-selected-distribution:
    name: Get selected distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get changes
        run: |
          git whatchanged --diff-filter=A



