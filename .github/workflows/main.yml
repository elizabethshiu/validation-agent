on:
  push:
    paths:
      - instana/**.yaml

jobs:      
  config_validation_job:
    name: Collector Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Get distribution
        id: selected-distro
        run: echo "DISTRO=$(cat selected-distribution)" >> $GITHUB_OUTPUT
      - name: Build Docker container
        run: docker build -t collector-container-${{steps.selected-distro.outputs.DISTRO}} -f validation/Dockerfile --build-arg VERSION=${{steps.selected-distro.outputs.DISTRO}} .
      - name: Run validation
        run: docker run collector-container-${{steps.selected-distro.outputs.DISTRO}}


